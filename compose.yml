services:
  # Use this to store runners, jobs and logs
  postgres:
    image: docker.io/postgres:17-alpine
    environment:
      POSTGRES_USER: jobsuser
      POSTGRES_PASSWORD: jobspass
      POSTGRES_DB: jobsdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsuser -d jobsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Can be used to cache things/reduce hits on DB
  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: ["--default_lua_flags=allow-undeclared-keys"]
    ports:
      - "6379:6379"
    ulimits:
      memlock: -1
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "6379" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # If you want to simulate sending the emails, you can use this SMTP server to preview
  # the emails that would be sent.
  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

